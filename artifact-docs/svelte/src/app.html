<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <title>artifact-docs</title>
    <!-- IBM Plex, a fonte da marca (skill brand-design). Pelo Google Fonts, e não por pacote
         npm: é só CSS e fonte, sem nada para manter, e o navegador guarda em cache. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <script>
      // Aplica o tema salvo ANTES da primeira pintura da tela — sem isso, quem usa o modo
      // escuro veria um flash branco toda vez que abrisse o sistema, até o JavaScript carregar.
      (() => {
        try {
          const saved = localStorage.getItem('acerola-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme =
            saved === 'light' || saved === 'dark' ? saved : prefersDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch {
          // Sem localStorage (modo privado, política do navegador)? Fica no tema claro padrão.
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
