# O MESMO hook do commit-msg, rodado em cada commit que chega ao GitHub.
#
# O hook local só vale na máquina onde alguém rodou `scripts/git/setup.sh`. Commit feito em
# outra máquina, pela interface do GitHub ou com `--no-verify` passa por aqui do mesmo jeito.
name: Checks/Commits

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Os SHAs entram por variável de ambiente, e não colados no comando.
      - name: Every commit follows the [tipo](local) Message format
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Primeiro push da branch: não existe "antes", confere o histórico inteiro.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$AFTER"
          else
            RANGE="$BEFORE..$AFTER"
          fi

          status=0
          for sha in $(git rev-list "$RANGE"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            if ! sh .githooks/commit-msg /tmp/msg; then
              echo "::error::Commit $sha fora do padrão [tipo](local): Mensagem"
              status=1
            fi
          done
          exit $status
