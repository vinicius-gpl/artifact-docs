# Tarefas que valem para o repositório inteiro. As do app ficam em artifact-docs/mise.toml;
# os atalhos abaixo (dev, build, check) só entram lá e rodam a de mesmo nome.
#
#   mise install            → instala Node, Go e golangci-lint nas versões abaixo
#   mise run setup          → git (hooks, template, Git-Flow) e dependências do front
#   mise run dev            → API Go :3010 + SPA :5010
#   mise run design:check   → reprova só violação de design NOVA (fora da baseline)
#   mise tasks              → lista tudo

[tools]
node = "24"
go = "1.27.1"
golangci-lint = "2.13.2"

[tasks.setup]
description = "Prepara a máquina: hooks do git, template de commit, Git-Flow e dependências do front"
run = ["sh scripts/git/setup.sh", "npm ci --prefix artifact-docs/svelte"]

# ── Atalhos para o app ───────────────────────────────────────────────────────

[tasks.dev]
description = "Sobe a API Go e a SPA juntas (artifact-docs/)"
dir = "artifact-docs"
run = "mise run dev"

[tasks.build]
description = "Binário único em artifact-docs/bin/artifact-docs (artifact-docs/)"
dir = "artifact-docs"
run = "mise run build"

[tasks.check]
description = "Tudo que o CI roda: o app (artifact-docs/) e as regras de design"
run = ["mise run design:check", "mise run design:test", "cd artifact-docs && mise run check"]

# ── Design (skills design-system e ui-standards) ─────────────────────────────

[tasks."design:check"]
description = "Regras de design no svelte/ e no src-go/ — só reprova o que é novo"
run = "node .claude/hooks/design/check-design.mjs"

[tasks."design:all"]
description = "Lista todas as violações de design, inclusive a dívida congelada na baseline"
run = "node .claude/hooks/design/check-design.mjs --all"

[tasks."design:update"]
description = "Regrava a baseline de design — só depois de CORRIGIR dívida; a baseline nunca cresce"
run = "node .claude/hooks/design/check-design.mjs --update"

[tasks."design:test"]
description = "Testes das regras de design (node:test)"
run = "node --test .claude/hooks/design/design-rules.test.mjs"
